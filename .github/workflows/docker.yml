name: Docker Build

on:
  push:
    branches: ["main"]

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t hello-world-python:latest .

      - name: Executar container
        run: docker run --rm hello-world-python:latest
